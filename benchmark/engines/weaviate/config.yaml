# Weaviate — Benchmark Configuration
#
# Architecture: HNSW, built-in hybrid search, module ecosystem
# Docker image: cr.weaviate.io/semitechnologies/weaviate:latest

engine:
  name: weaviate
  version: latest
  docker_image: cr.weaviate.io/semitechnologies/weaviate:latest

# Index configuration
index:
  hnsw_ef_construction: 200
  hnsw_ef: 128
  hnsw_max_connections: 16
  vector_cache_max_objects: 1000000000

# Storage
storage:
  data_path: /data/weaviate
  persistence_data_path: /data/weaviate

# Search
search:
  default_top_k: 10

# Hybrid search
hybrid:
  enabled: true
  alpha: 0.5                     # 0 = pure BM25, 1 = pure vector

# Resource limits
resources:
  memory_limit: null
  cpu_limit: null

# Server
server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
